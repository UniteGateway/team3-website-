<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Sign in · Weekend News Studio</title>
<link rel="icon" href="/assets/img/symbol.webp"><link rel="stylesheet" href="/weekend/weekend.css"></head>
<body><main class="login">
<form id="f" autocomplete="on">
<div class="mast">Weekend</div>
<h1>News Studio</h1><p style="color:#6E6E73;margin:0">Admin sign-in · by TEAM3 Solutions</p>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn red" type="submit">Sign in</button>
<div class="err" id="err" role="alert"></div>
<small>Authorised editors only. Sessions last 12 hours.</small>
</form></main>
<script type="module" src="/weekend/login.js"></script></body></html>
